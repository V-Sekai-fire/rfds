# The RFD site: the flake builds it (RFD66606-2501), ORAS publishes
# it to ghcr.io/v-sekai-fire/rfds, and Pages serves the copy pulled
# by digest.
name: nix
on:
  workflow_call:
    inputs:
      run:
        description: Build the site. When false the jobs report as skipped.
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  breaker:
    if: ${{ inputs.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    outputs:
      closed: ${{ steps.breaker.outputs.closed }}
    steps:
      - id: breaker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=$(gh run list -R "$GITHUB_REPOSITORY" \
            --workflow nix.yml \
            --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            --status completed --limit 20 --json conclusion \
            --jq '[.[]|select(.conclusion=="success" or
              .conclusion=="failure")][0:3]
              |map(select(.conclusion=="failure"))|length')
          if [ "$failed" -ge 3 ] &&
             [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo closed=false >> "$GITHUB_OUTPUT"
            echo "Circuit open: the last 3 builds failed." \
              "Run nix by hand after a fix." >> "$GITHUB_STEP_SUMMARY"
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
          else
            echo closed=true >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: breaker
    if: needs.breaker.outputs.closed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - id: key
        run: |
          lock=${{ hashFiles('flake.lock') }}
          echo "key=nix-$RUNNER_OS-$lock" >> "$GITHUB_OUTPUT"
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: ${{ steps.key.outputs.key }}-${{ github.sha }}
          restore-prefixes-first-match: |
            ${{ steps.key.outputs.key }}-
            nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - run: nix flake check --no-build
      - run: nix build .#site -L --out-link result
      - if: github.event_name == 'push'
        uses: oras-project/setup-oras@v1
      - id: push
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          when=$(git show -s --format=%ct)
          stamp=$(date -u -d @"$when" +%Y%m%d%H%M%S)
          tag="v0.0.0-$stamp-${GITHUB_SHA:0:12}"
          mkdir out
          cp -rL result out/site
          # The store copy is read-only; a read-only folder in the
          # tar cannot be written into when it is pulled.
          chmod -R u+w out/site
          cd out
          find site -type f | sort | xargs sha256sum > SHA256SUMS
          echo "$TOKEN" |
            oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest=$(oras push "ghcr.io/v-sekai-fire/rfds:$tag" \
            --artifact-type application/vnd.v-sekai.rfds.site \
            site SHA256SUMS --format go-template='{{.digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "oras pull ghcr.io/v-sekai-fire/rfds@$digest ($tag)" \
            >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: oras-project/setup-oras@v1
      - env:
          TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -eu
          echo "$TOKEN" |
            oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          oras pull "ghcr.io/v-sekai-fire/rfds@$DIGEST" -o pulled
          cd pulled
          sha256sum -c --quiet SHA256SUMS
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pulled/site
      - id: deployment
        uses: actions/deploy-pages@v4
