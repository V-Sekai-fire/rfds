name: Render the RFD sources
description: >-
  Install the BEAM, render rfd/*.txn into the Markdown the gates read, and validate
  the apparatus plan sources. The rendered Markdown is a build
  artifact (RFD66606-2232), so every job that reads the tree renders first.
runs:
  using: composite
  steps:
    - uses: erlef/setup-beam@v1
      with:
        otp-version: "29"
        elixir-version: "1.20.4"
    - run: mix local.hex --force && mix local.rebar --force && mix deps.get
      shell: bash
    - run: mix rfd.render
      shell: bash
    - run: mix rfd.plan
      shell: bash
